include:
  - tenants-docker-yml/lloyds-garden.yml
 # - tenants-docker-yml/west-coast-avinash.yml

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [web]

services:
  traefik:
    <<: *service-defaults
    image: traefik:v2.11
    container_name: veena-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    #  - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    environment:
      - DOCKER_API_VERSION=1.40
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: veena-postgres
    environment:
      POSTGRES_DB: central_dashboard
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *service-defaults
    build: ./central-dashboard/backend
    container_name: veena-central-dashboard-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/central_dashboard
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      DOMAIN_VALIDATION_ENABLED: "true"
    volumes:
      - uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    # No Traefik labels: only reached internally, via dashboard-frontend's /api proxy.

  # The one shared central-dashboard app. Every tenant site's login page (and the Angular app
  # itself) talks to this same frontend+backend pair — just reachable at each tenant's own
  # dashboard.<their-domain> host. No tenant-specific Host() rule here: each tenant's own
  # dashboard.<domain> router lives in its tenants-docker-yml/*.yml file and points at the
  # "dashboard" service published below, so adding a tenant never requires editing this block.
  dashboard-frontend:
    <<: *service-defaults
    build: ./central-dashboard/frontend
    container_name: veena-central-dashboard-frontend
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.services.dashboard.loadbalancer.server.port=80

  # Tenant marketing sites (lloyds-garden-site, west-coast-avinash-site, ...) live in
  # tenants-docker-yml/*.yml, pulled in via the include: list at the top of this file.
  # To add a new tenant, see tenants-docker-yml/_template.yml.example.

networks:
  web:
    driver: bridge

volumes:
  pgdata:
  uploads:
  backend-logs:
  traefik-certs:
