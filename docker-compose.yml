services:
  traefik:
    image: traefik:v3.1
    container_name: veena-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    restart: unless-stopped
    networks: [web]

  postgres:
    image: postgres:16-alpine
    container_name: veena-postgres
    environment:
      POSTGRES_DB: central_dashboard
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [web]

  backend:
    build: ./central-dashboard/backend
    container_name: veena-central-dashboard-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/central_dashboard
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      DOMAIN_VALIDATION_ENABLED: "true"
    volumes:
      - uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [web]
    # No Traefik labels: only reached internally, via dashboard-frontend's /api proxy.

  # The one shared central-dashboard app. Every tenant site's login page (and the Angular app
  # itself) talks to this same frontend+backend pair — just reachable at each tenant's own
  # dashboard.<their-domain> host. Add one more Host(...) clause here per new tenant.
  dashboard-frontend:
    build: ./central-dashboard/frontend
    container_name: veena-central-dashboard-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`dashboard.llyodschsl.com`) || Host(`dashboard.westcoastavinash.com`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=le
      - traefik.http.services.dashboard.loadbalancer.server.port=80

  llyods-site:
    build: ./llyods-chsl
    container_name: veena-llyods-site
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.http.routers.llyods.rule=Host(`llyodschsl.com`) || Host(`www.llyodschsl.com`)
      - traefik.http.routers.llyods.entrypoints=websecure
      - traefik.http.routers.llyods.tls.certresolver=le
      - traefik.http.services.llyods.loadbalancer.server.port=80

  westcoast-site:
    build: ./westcoast
    container_name: veena-westcoast-site
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.http.routers.westcoast.rule=Host(`westcoastavinash.com`) || Host(`www.westcoastavinash.com`)
      - traefik.http.routers.westcoast.entrypoints=websecure
      - traefik.http.routers.westcoast.tls.certresolver=le
      - traefik.http.services.westcoast.loadbalancer.server.port=80

  # --- Template for the next tenant site (copy, rename, uncomment) ---
  # newclient-site:
  #   build: ./newclient
  #   container_name: veena-newclient-site
  #   restart: unless-stopped
  #   networks: [web]
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.newclient.rule=Host(`newclient.com`) || Host(`www.newclient.com`)
  #     - traefik.http.routers.newclient.entrypoints=websecure
  #     - traefik.http.routers.newclient.tls.certresolver=le
  #     - traefik.http.services.newclient.loadbalancer.server.port=80
  # Also add: || Host(`dashboard.newclient.com`) to the dashboard-frontend router rule above.

networks:
  web:
    driver: bridge

volumes:
  pgdata:
  uploads:
  backend-logs:
  traefik-certs:
