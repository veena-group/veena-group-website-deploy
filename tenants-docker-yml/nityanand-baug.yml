services:
  nityanand-baug-site:
    build: ../nityanand-baug
    container_name: veena-nityanand-baug-site
    restart: unless-stopped
    networks: [web]
    depends_on:
      - dashboard-frontend
    labels:
      - traefik.enable=true
      - traefik.http.routers.nityanand-baug.rule=Host(`nityanandbaug.com`) || Host(`www.nityanandbaug.com`)
      - traefik.http.routers.nityanand-baug.entrypoints=websecure
      - traefik.http.routers.nityanand-baug.tls.certresolver=le
      - traefik.http.services.nityanand-baug.loadbalancer.server.port=80
      # This tenant's dashboard subdomain, routed to the shared dashboard-frontend container
      # (see its "dashboard" service label in ../docker-compose.yml).
      - traefik.http.routers.dashboard-nityanand-baug.rule=Host(`dashboard.nityanandbaug.com`)
      - traefik.http.routers.dashboard-nityanand-baug.entrypoints=websecure
      - traefik.http.routers.dashboard-nityanand-baug.tls.certresolver=le
      - traefik.http.routers.dashboard-nityanand-baug.service=dashboard
