services:
  westcoast-site:
    build: ../westcoast
    container_name: veena-westcoast-site
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.http.routers.westcoast.rule=Host(`westcoastavinash.com`) || Host(`www.westcoastavinash.com`)
      - traefik.http.routers.westcoast.entrypoints=websecure
      - traefik.http.routers.westcoast.tls.certresolver=le
      - traefik.http.services.westcoast.loadbalancer.server.port=80
      # This tenant's dashboard subdomain, routed to the shared dashboard-frontend container
      # (see its "dashboard" service label in ../docker-compose.yml).
      - traefik.http.routers.dashboard-westcoast.rule=Host(`dashboard.westcoastavinash.com`)
      - traefik.http.routers.dashboard-westcoast.entrypoints=websecure
      - traefik.http.routers.dashboard-westcoast.tls.certresolver=le
      - traefik.http.routers.dashboard-westcoast.service=dashboard
